<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/MarkerCluster.css">
        <link rel="stylesheet" href="css/MarkerCluster.Default.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map"></div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet.markercluster.js"></script>
        <script src="data/villagesizev1_3.js"></script>
        <script src="data/week5_table2_4.js"></script>
        <script src="data/module1_photopath_5.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[22.280143961866028,113.93401059253787],[22.28419323927383,113.94088141094889]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; Leaflet &middot; QGIS');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        
        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }

        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() { popup.update(); });
                            img.addEventListener('error', function() { popup.update(); });
                        }
                    }
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        
        map.createPane('pane_OPM100_2025_0');
        map.getPane('pane_OPM100_2025_0').style.zIndex = 400;
        var img_OPM100_2025_0 = 'data/OPM100_2025_0.png';
        var img_bounds_OPM100_2025_0 = [[22.076205181083964,113.75167100210537],[22.624727555473488,114.51155829843452]];
        var layer_OPM100_2025_0 = new L.imageOverlay(img_OPM100_2025_0, img_bounds_OPM100_2025_0, {pane: 'pane_OPM100_2025_0'});
        bounds_group.addLayer(layer_OPM100_2025_0);
        map.addLayer(layer_OPM100_2025_0);

        map.createPane('pane_9SEA_1');
        map.getPane('pane_9SEA_1').style.zIndex = 401;
        var img_9SEA_1 = 'data/9SEA_1.png';
        var img_bounds_9SEA_1 = [[22.273607952312364,113.89769308407159],[22.300758044667496,113.93413201704129]];
        var layer_9SEA_1 = new L.imageOverlay(img_9SEA_1, img_bounds_9SEA_1, {pane: 'pane_9SEA_1'});
        bounds_group.addLayer(layer_9SEA_1);
        map.addLayer(layer_9SEA_1);

        map.createPane('pane_9SEB_2');
        map.getPane('pane_9SEB_2').style.zIndex = 402;
        var img_9SEB_2 = 'data/9SEB_2.png';
        var img_bounds_9SEB_2 = [[22.273666401328807,113.93408524462212],[22.300808410150857,113.9705172786357]];
        var layer_9SEB_2 = new L.imageOverlay(img_9SEB_2, img_bounds_9SEB_2, {pane: 'pane_9SEB_2'});
        bounds_group.addLayer(layer_9SEB_2);
        map.addLayer(layer_9SEB_2);

        function pop_villagesizev1_3(feature, layer) {
            var popupContent = '<table><tr><td colspan="2">' + (feature.properties['村落'] !== null ? autolinker.link(String(feature.properties['村落']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr><tr><td colspan="2">' + (feature.properties['總戶數（戶）'] !== null ? autolinker.link(String(feature.properties['總戶數（戶）']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr><tr><td colspan="2">' + (feature.properties['總人口（人）'] !== null ? autolinker.link(String(feature.properties['總人口（人）']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr></table>';
            layer.bindPopup(removeEmptyRowsFromPopupContent(popupContent, feature), { maxHeight: 400 });
        }
        function style_villagesizev1_3_0() {
            return { pane: 'pane_villagesizev1_3', radius: 8.0, opacity: 1, color: 'rgba(61,128,53,1.0)', weight: 2.0, fill: true, fillOpacity: 1, fillColor: 'rgba(84,176,74,1.0)' };
        }
        map.createPane('pane_villagesizev1_3');
        map.getPane('pane_villagesizev1_3').style.zIndex = 403;
        var layer_villagesizev1_3 = new L.geoJson(json_villagesizev1_3, {
            pane: 'pane_villagesizev1_3',
            onEachFeature: pop_villagesizev1_3,
            pointToLayer: function (feature, latlng) { return L.circleMarker(latlng, style_villagesizev1_3_0()); },
        });
        var cluster_villagesizev1_3 = new L.MarkerClusterGroup({showCoverageOnHover: false});
        cluster_villagesizev1_3.addLayer(layer_villagesizev1_3);
        bounds_group.addLayer(layer_villagesizev1_3);
        cluster_villagesizev1_3.addTo(map);

        function pop_week5_table2_4(feature, layer) {
            var popupContent = '<table><tr><td colspan="2">' + (feature.properties['photo_no'] !== null ? autolinker.link(String(feature.properties['photo_no']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr><tr><td colspan="2">' + (feature.properties['photo_path'] !== null ? '<img src="images/' + String(feature.properties['photo_path']).trim() + '">' : '') + '</td></tr></table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
            layer.bindPopup(content, { maxHeight: 400 });
        }
        function style_week5_table2_4_0() {
            return { pane: 'pane_week5_table2_4', radius: 8.0, opacity: 1, color: 'rgba(61,128,53,1.0)', weight: 2.0, fill: true, fillOpacity: 1, fillColor: 'rgba(238,0,33,1.0)' };
        }
        map.createPane('pane_week5_table2_4');
        map.getPane('pane_week5_table2_4').style.zIndex = 404;
        var layer_week5_table2_4 = new L.geoJson(json_week5_table2_4, {
            pane: 'pane_week5_table2_4',
            onEachFeature: pop_week5_table2_4,
            pointToLayer: function (feature, latlng) { return L.circleMarker(latlng, style_week5_table2_4_0()); },
        });
        var cluster_week5_table2_4 = new L.MarkerClusterGroup({showCoverageOnHover: false});
        cluster_week5_table2_4.addLayer(layer_week5_table2_4);
        bounds_group.addLayer(layer_week5_table2_4);
        cluster_week5_table2_4.addTo(map);

        function pop_module1_photopath_5(feature, layer) {
            var popupContent = '<table><tr><td colspan="2">' + (feature.properties['record_no'] !== null ? autolinker.link(String(feature.properties['record_no']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr><tr><td colspan="2">' + (feature.properties['Location_note'] !== null ? autolinker.link(String(feature.properties['Location_note']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr><tr><td colspan="2">' + (feature.properties['photo_path'] !== null ? '<img src="images/' + String(feature.properties['photo_path']).trim() + '">' : '') + '</td></tr></table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
            layer.bindPopup(content, { maxHeight: 400 });
        }
        function style_module1_photopath_5_0(feature) {
            return { pane: 'pane_module1_photopath_5', radius: 8.0, opacity: 1, color: 'rgba(128,17,25,1.0)', weight: 2.0, fill: true, fillOpacity: 1, fillColor: 'rgba(215,25,28,1.0)' };
        }
        map.createPane('pane_module1_photopath_5');
        map.getPane('pane_module1_photopath_5').style.zIndex = 405;
        var layer_module1_photopath_5 = new L.geoJson(json_module1_photopath_5, {
            pane: 'pane_module1_photopath_5',
            onEachFeature: pop_module1_photopath_5,
            pointToLayer: function (feature, latlng) { return L.circleMarker(latlng, style_module1_photopath_5_0(feature)); },
        });
        var cluster_module1_photopath_5 = new L.MarkerClusterGroup({showCoverageOnHover: false});
        cluster_module1_photopath_5.addLayer(layer_module1_photopath_5);
        bounds_group.addLayer(layer_module1_photopath_5);
        cluster_module1_photopath_5.addTo(map);

        var i = 0;
        layer_villagesizev1_3.eachLayer(function(layer) {
            layer.bindTooltip((layer.feature.properties['村落'] !== null?String('<div style="color: #323232; font-size: 10pt; font-family: \'Kaiti TC\', sans-serif;">' + layer.feature.properties['村落']).replace(/\\n/g, '<br>') + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_villagesizev1_3'});
            labels.push(layer);
            totalMarkers += 1;
            layer.added = true;
            addLabel(layer, i);
            i++;
        });
        L.ImageOverlay.include({ getBounds: function () { return this._bounds; } });
        resetLabels([layer_villagesizev1_3,layer_week5_table2_4]);
        map.on("zoomend", function(){ resetLabels([layer_villagesizev1_3,layer_week5_table2_4]); });
        </script>        
    </body>
</html>
