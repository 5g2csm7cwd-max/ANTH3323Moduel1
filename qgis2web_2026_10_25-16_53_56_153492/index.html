        function buildPhotoSrc(rawPath) {
            if (rawPath == null) return '';
            var p = String(rawPath).trim().replace(/\\/g, '/'); // 將反斜線統一改為正斜線
            
            // 如果資料庫存的是絕對路徑 (例如 C:/xxx/xxx.jpg)，只取最後的檔名
            if (p.indexOf('/') !== -1) {
                p = p.split('/').pop();
            }
            
            // 去除檔名中的特殊字元，並加上 images/ 前綴
            // 假設你把照片都放在 images 資料夾裡
            return 'images/' + encodeURIComponent(p);
        }
